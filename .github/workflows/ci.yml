name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/check_distribution.py
      - run: python scripts/package_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: tollgate-deployment
          path: dist/tollgate-deployment.tar.gz
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env: {POSTGRES_USER: tollgate, POSTGRES_PASSWORD: tollgate-local-only, POSTGRES_DB: tollgate}
        ports: ['55487:5432']
        options: --health-cmd "pg_isready -U tollgate" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4.8-alpine
        ports: ['63987:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv && .venv/bin/pip install -r apps/gateway/requirements-dev.lock && .venv/bin/pip install --no-deps -e 'apps/gateway[dev]'
      - run: .venv/bin/ruff check --config apps/gateway/pyproject.toml apps/gateway
      - run: .venv/bin/mypy --config-file apps/gateway/pyproject.toml apps/gateway/src
      - run: .venv/bin/pytest -c apps/gateway/pyproject.toml apps/gateway/tests -q
        env:
          TEST_REDIS_URL: redis://localhost:63987/15
          TEST_DATABASE_URL: postgresql+asyncpg://tollgate:tollgate-local-only@localhost:55487/tollgate
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/dashboard/package-lock.json}
      - run: npm ci --prefix apps/dashboard
      - run: npm run lint --prefix apps/dashboard && npm run typecheck --prefix apps/dashboard
      - run: npm run build --prefix apps/dashboard
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv && .venv/bin/pip install -r apps/gateway/requirements.lock && .venv/bin/pip install --no-deps -e apps/gateway
      - run: npx --prefix apps/dashboard playwright install --with-deps chromium
      - name: Start demo and exercise browser flows
        run: |
          TOLLGATE_DEMO=true .venv/bin/tollgate serve > /tmp/tollgate-api.log 2>&1 &
          npm run start --prefix apps/dashboard > /tmp/tollgate-ui.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://localhost:3187/login > /dev/null && break; sleep 1; done
          npm run test:e2e --prefix apps/dashboard
      - uses: actions/upload-artifact@v7
        if: failure()
        with: {name: browser-failures, path: apps/dashboard/test-results}

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [gateway, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv && .venv/bin/pip install -r apps/gateway/requirements.lock
      - name: Build and start isolated full stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - run: .venv/bin/python scripts/compose_smoke.py
      - name: Stop only application roles before image-only verification
        run: docker compose -f deploy/docker-compose.yml stop dashboard gateway worker migrate
      - name: Create a fresh image-deployment database
        run: docker compose -f deploy/docker-compose.yml exec -T postgres createdb -U tollgate tollgate_image_ci
      - name: Start prebuilt images with external CI stores (no source build)
        env:
          TOLLGATE_IMAGE: tollgate:local
          TOLLGATE_DASHBOARD_IMAGE: tollgate-dashboard:local
          TOLLGATE_DATABASE_URL: postgresql+asyncpg://tollgate:tollgate-local-only@postgres:5432/tollgate_image_ci
          TOLLGATE_REDIS_URL: redis://redis:6379/1
          TOLLGATE_ADMIN_EMAIL: image-owner@example.invalid
          TOLLGATE_ADMIN_PASSWORD: image-smoke-test-only
          TOLLGATE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TOLLGATE_ENABLE_MOCK_PROVIDER: 'true'
        run: docker compose -f deploy/compose.images.yml --profile dashboard up -d --pull never --wait --wait-timeout 180
      - name: Exercise image-only deployment through dashboard proxy
        env:
          TOLLGATE_ADMIN_EMAIL: image-owner@example.invalid
          TOLLGATE_ADMIN_PASSWORD: image-smoke-test-only
        run: .venv/bin/python scripts/distribution_smoke.py
      - name: Inspect failed services
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=150
      - name: Stop this CI stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
