name: Publish images (owner triggered)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed release tag, for example v0.1.0'
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {image: tollgate, dockerfile: apps/gateway/Dockerfile}
          - {image: tollgate-dashboard, dockerfile: apps/dashboard/Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.version }}'}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: namespace
        env: {OWNER: '${{ github.repository_owner }}'}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image digest
        env:
          IMAGE: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
