[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate"
version = "0.2.0"
description = "Meter, limit, and protect AI usage per customer"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.15,<2", "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "redis>=6,<8", "cryptography>=46,<49", "argon2-cffi>=23,<26", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "respx", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
tollgate = "tollgate.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
tollgate = ["lua/*.lua", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
